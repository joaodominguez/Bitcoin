services:
  btcsim:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DASHBOARD_USER: ${DASHBOARD_USER:-btcsim}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://91.99.167.243:8000}
    volumes:
      - btcsim-cache:/app/.cache
      - btcsim-state:/app/state

  watcher:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "btcsim.watchlist", "--loop", "--every-hours", "1"]
    environment:
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://91.99.167.243:8000}
    volumes:
      - btcsim-cache:/app/.cache
      - btcsim-state:/app/state

volumes:
  btcsim-cache:
  btcsim-state:
