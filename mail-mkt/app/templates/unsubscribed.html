<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Subscrição</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0f1419; color:#e7ecf3; display:grid; place-items:center; min-height:100vh; margin:0; padding:24px; }
    .box { background:#1c232d; border:1px solid #2a3340; border-radius:14px; padding:28px; max-width:420px; text-align:center; }
    h1 { margin:0 0 10px; font-size:1.2rem; }
    p { color:#8b97a8; line-height:1.45; }
    .ok { color:#3ecf8e; }
    .err { color:#f07178; }
  </style>
</head>
<body>
  <div class="box">
    {% if ok %}
    <h1 class="ok">Subscrição cancelada</h1>
    <p>{{ email }} foi removido da lista de envios.</p>
    {% else %}
    <h1 class="err">Link inválido</h1>
    <p>Este link de cancelamento já não é válido.</p>
    {% endif %}
  </div>
</body>
</html>
