<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar — mail-mkt</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0f1419; --panel:#1c232d; --line:#2a3340; --text:#e7ecf3; --muted:#8b97a8; --accent:#3d9cf0; --err:#f07178; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: "DM Sans", sans-serif; color: var(--text);
      background: radial-gradient(800px 400px at 20% 0%, rgba(61,156,240,.12), transparent 55%), var(--bg);
    }
    .panel {
      width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line);
      border-radius: 16px; padding: 28px 24px;
    }
    h1 { margin: 0 0 6px; font-size: 1.3rem; }
    h1 span { color: var(--accent); }
    p { margin: 0 0 20px; color: var(--muted); font-size: .9rem; line-height: 1.45; }
    label { display:block; font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
    input {
      width:100%; margin-bottom:14px; padding:12px 14px; border-radius:10px;
      border:1px solid var(--line); background:#0f1419; color:var(--text); font:500 14px "DM Sans",sans-serif;
    }
    button {
      width:100%; margin-top:6px; border:0; border-radius:10px; padding:12px;
      background: var(--accent); color:#041018; font:700 14px "DM Sans",sans-serif; cursor:pointer;
    }
    .err { background:rgba(240,113,120,.12); border:1px solid rgba(240,113,120,.35); color:var(--err); padding:10px 12px; border-radius:10px; margin-bottom:14px; font-size:.88rem; }
  </style>
</head>
<body>
  <form class="panel" method="post" action="{{ url_for('main.login') }}">
    <h1>mail-<span>mkt</span></h1>
    <p>Plataforma de listas e envio. Entra para gerir contactos.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <label for="username">Utilizador</label>
    <input id="username" name="username" value="{{ username or 'mailmkt' }}" required autofocus />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required />
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
